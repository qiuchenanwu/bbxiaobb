<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:hover{
            color: red;
            background-color: aqua;
        }
        p:hover{
            color: pink;
        }
    </style>
</head>
<!-- 
作用：选中 鼠标悬停 在元素上的状态设置样式选择器 语法:选择器:hover{css)
注意点:
1.伪类选择器选中的元素的某种状态
-->
<body>
    <a href="#">超链接</a>
    <p>p标签</p>
</body>
</html>
