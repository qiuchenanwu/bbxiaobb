<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 在网页中显示图片 要想在网页中实现效果，需要和标签属性搭配使用 -->
    <!-- src 图片相对路径 alt 当图片没有显示时浏览器所呈现给用户的文字-->
    <img src="img/46a987a341cd0aaa9de1c921341e6319.jpg" alt="我是替换文本">
    <!-- 属性注意点
            1、标签的属性写在 开始标签内部
            2、标签上可以存在多个属性
            3、属性之间用空格隔开
            4、标签名与属性之间 必须 用空格隔开
            5、属性之间没有顺序之分
    -->
</body>
</html>
