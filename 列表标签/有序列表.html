<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    场景:在网页中表示一组有顺序之分的列表，如:排行榜。标签组成:
    标签名
    说明
    显示特点:
    ol 表示有序列表的整体，用于包裹标签
    li 表示有序列表的每一项，用于包含每一行的内容
    列表的每一项前默认显示序号标识注意点:
    ol标签中只允许包含li标签
    li标签可以包含任意内容
    -->
    <h1>成绩排行榜</h1>
    <ol>
        <li>小姐姐</li>
        <li>小哥哥</li>
        <li>小可爱</li>
    </ol>
</body>
</html>
