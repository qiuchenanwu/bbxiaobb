<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    场景:
    在网页中表示一组无顺序之分的列表，如:新闻列表。
    标签组成:
    ul 表示无序列表的整体，用于包裹标签
    li 表示无序列表的每一项，用于包含每一行的内容
    显示特点:
    列表的每一项前默认显示圆点标识注意点:
    ul标签中只允许包含i标签
    li标签可以包含任意内容
    -->
    <h3>水果列表</h3>
    <ul>
        <li>榴莲</li>
        <li>香蕉</li>
        <li>苹果</li>
        <li>哈密瓜</li>
        <li>火龙果</li>
    </ul>
</body>
</html>
