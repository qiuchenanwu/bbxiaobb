<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    场景:在网页中以行+列的单元格的方式整齐展示和数据，
    基本标签:
    标签名
    table
    tr
    td
    说明
    表格整体
    可用于包裹多个tr
    表格每行，可用于包裹td
    表格单元格，可用于包裹内容
    注意点:
    标签的嵌套关系:table>tr>td
    -->
    <table border="1" width="600">
        <caption>学生成绩单</caption>
        <tr>
            <th>姓名</th>
            <th>成绩</th>
            <th>评语</th>
        </tr>
        <tr>
            <td>小哥哥</td>
            <td>100</td>
            <td>真帅气</td>
        </tr>
        <tr>
            <td>小姐姐</td>
            <td>100</td>
            <td>真美丽</td>
        </tr>
        <tr>
            <td>总结</td>
            <td>郎才女貌</td>
            <td>郎才女貌</td>
        </tr>
    </table>
    <!-- 
    场景:设置表格基本展示效果常见相关属性:
    属性名  属性值  效果
    border  数字    边框宽度
    width   数字    表格宽度
    height  数字    表格高度
    宽高一般在css里设置
    -->

    <!-- 
    场景:在表格中表示整体大标题和一列小标题其他标签:
    标签名  名称
    caption 表格大标题
    th      表头单元格
    
    说明
    表示表格整体大标题，默认在表格整体顶部居中位置显示
    表示一列小标题，通常用于表格第一行，默认内部文字加粗并居中显示
    注意点:
    caption标签书写在table标签内部
    th标签书写在tr标签内部(用于替换td标签)
    -->
</body>
</html>
