<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    合并单元格步骤:
    1.明确合并哪几个单元格
    2.通过左上原则，确定保留谁删除谁
    上下合并一只保留最上的，删除其他
    左右合并一只保留最左的，删除其他3.给保留的单元格设置:跨行合井(rowspan)或者跨列合并(colspan)
    属性名属性值
    rowspan合并单元格的个数
    colspan合并单元格的个数
    跨行合并，将多行的单元格册直合并
    跨列合并，将多列的单元格水平合并
    注意点:
    只有 同一个结构标签 中的单元格才能合并，不能跨结构标签合并(不能跨:thead、tbody、tfoot)
    -->
    <table border="1">
        <caption>学生成绩单</caption>
        <thead>
            <tr>
            <th>姓名</th>
            <th>成绩</th>
            <th>评语</th>
            </tr>
        </thead>
        <tbody>
            <tr>
            <td>小哥哥</td>
            <td rowspan="2">100分</td>
            <td>真帅</td>
            </tr>
            <tr>
            <td>小姐姐</td>
            <td>真美</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
            <td>总结</td>
            <td colspan="2">郎才女貌</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
