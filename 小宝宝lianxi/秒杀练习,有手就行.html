<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0%;
            padding: 0%;
        }
        .header {
            height: 80px;
            background-color: black;
        }
        .center {
            margin: 0 auto;
        }
        .blue {
            background-color: blue;
        }
        .green {
            height: 500px;
            background-color: green;
        }
        .purple {
            height: 85px;
            background-color: purple;
        }
    </style>
</head>
    <!-- 头部 -->
    <header class="header">
        <div>
        </div>
    </header>

    <!-- 主体 -->
    <main>
     <div class="blue center">
        蓝色
     </div>
     <div class="green center">
        绿色
     </div>
    </main>

    <!-- 脚 -->
     <footer class="purple">
        <div>
            紫色
        </div>
     </footer>
</body>
</html>
