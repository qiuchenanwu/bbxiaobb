<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: rebeccapurple;
        }
        div{
            color: red;
        }
    </style>
</head>
<body>
    <!-- 
    作用:通过标签名，找到页面中所有这类标签，设置样式
    注意点:
    1.标签选择器选择的是一类标签，而不是单独某一个
    2. 标签选择器无论嵌套关系有多深，都能找到对应的标签
    -->
    <p>111</p>
    <div>222</div>
</body>
</html>
